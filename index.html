<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Biotech catalyst watchlist</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;700&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f4;--card:#fff;--ink:#14232b;--mut:#5b6b73;--ln:#d3dde1;--ac:#0e7c86;--up:#17794a;--dn:#b4452f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1a1f;--card:#17262d;--ink:#e6eef1;--mut:#9ab0b9;--ln:#2a3d46;--ac:#45b8c2;--up:#4cc58a;--dn:#ef8a74}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif;max-width:860px;margin:auto;padding:16px}
h1,h2{font-family:Newsreader,Georgia,serif;margin:0}h1{font-size:28px}h2{font-size:20px}
.mut{color:var(--mut);font-size:13px}.panel,details{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:14px;margin:12px 0}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
label{display:block;font-weight:600;font-size:13px}label output{float:right;color:var(--ac)}input[type=range]{width:100%;accent-color:var(--ac)}
summary{cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:baseline;list-style:none}
.ev{font-weight:700}.up{color:var(--up)}.dn{color:var(--dn)}
.sc{border-left:3px solid var(--up);padding-left:10px;margin:8px 0}.sc.n{border-color:var(--dn)}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:6px 8px;border-bottom:1px solid var(--ln);text-align:left;white-space:nowrap}
</style></head><body>
<h1>Biotech catalyst watchlist</h1>
<p class="mut" id="asof"></p>
<p class="mut">Research tool, not financial advice. Success odds, upside and downside figures are my starting assumptions, not forecasts. Change them with the sliders.</p>

<div class="panel"><div class="ctl" id="ctl"></div></div>
<div class="panel tbl"><h2>Ranking</h2><table id="rank"></table></div>
<div id="cards"></div>

<script>
const D={asof:"Nov 25, 2026 (prices from Nov 10–17 where shown)",co:[
{s:"MLYS",n:"Mineralys",px:15.79,pd:"Nov 10",depth:"Single lead drug",st:"Lorundrostat (hypertension) under FDA review",hd:"FDA decision due Dec 22, 2026. Net cash after debt is about 38% of the share price.",ev:"FDA decision",dt:"2026-12-22",p:.8,u:100,d:62,pos:"Approval: launch funding and partner interest improve. Banks median target implies roughly +180%, but a big gain may bring a share sale.",neg:"Rejection or delay: price could fall toward net cash (about -62%), and a new raise would likely dilute holders."},
{s:"COGT",n:"Cogent",px:33.55,pd:"Nov 10",depth:"Lead drug plus follow-ons",st:"Bezuclastinib (systemic mastocytosis) under FDA review",hd:"FDA decision due Dec 30, 2026; then label expansion trials.",ev:"FDA decision",dt:"2026-12-30",p:.85,u:40,d:45,pos:"Approval: first revenue, lower financing risk, room to fund other indications.",neg:"Rejection: lead program stalls, stock reprices sharply, financing gets costlier."},
{s:"CORT",n:"Corcept",px:70.07,pd:"Nov 17",depth:"Marketed drugs plus new indication",st:"Relacorilant resubmission under FDA review",hd:"Decision expected by Dec 17, 2026. Q3 revenue was $340.5M. Stock peaked at $123.57 on Aug 25.",ev:"FDA decision",dt:"2026-12-17",p:.65,u:25,d:40,pos:"Approval: new product revenue on top of an already profitable business.",neg:"Another rejection: stock already fell far from its high, further drop is possible. Funding is not at risk."},
{s:"ANAB",n:"AnaptysBio",px:48.38,pd:"Nov 10",depth:"Partnered drug plus pipeline",st:"Imsidolimab (rare skin disease) under FDA review, partner Vanda",hd:"FDA decision due Dec 12, 2026. Market cap about $1.45B.",ev:"FDA decision",dt:"2026-12-12",p:.75,u:20,d:35,pos:"Approval: milestone and royalty income via partner.",neg:"Rejection: lost milestones, pipeline must carry the stock."},
{s:"ALT",n:"Altimmune",px:null,pd:"",depth:"Early-mid stage",st:"Pemvidutide, Phase 3 planning for alcohol use disorder",hd:"End-of-Phase 2 FDA meeting in Dec 2026 (exact date not set). Current price not verified; fell 20% to $4.02 after an earlier trial update.",ev:"FDA meeting",dt:"2026-12-15",p:.6,u:30,d:30,pos:"Clear Phase 3 path: easier to raise money or partner.",neg:"FDA asks for more work: delay, dilution likely."},
{s:"CNTB",n:"Connect Biopharma",px:null,pd:"",depth:"Early-mid stage",st:"Rademikibart (asthma attacks), Phase 3 planning",hd:"FDA meeting in Dec 2026. Price not verified.",ev:"FDA meeting",dt:"2026-12-15",p:.6,u:40,d:30,pos:"Agreed Phase 3 design: unlocks funding or a partner.",neg:"Extra studies requested: more cash needed, dilution."},
{s:"NGEN",n:"NervGen",px:null,pd:"",depth:"Single drug, many indications planned",st:"NVG-291 in Phase 3 (spinal cord injury)",hd:"Enrollment ends 2H 2027, topline data 1H 2028. Cash was $16.6M on Mar 31, so raises are likely before then.",ev:"Phase 3 topline",dt:"2028-03-31",p:.35,u:200,d:70,pos:"Positive data: large re-rating, then a funding round from strength.",neg:"Miss: stock could lose most of its value."},
{s:"VKTX",n:"Viking",px:25.36,pd:"Oct 28",depth:"One franchise, 4 Phase 3 trials plus early drug",st:"VK2735 obesity, injectable and oral Phase 3",hd:"Injectable trials finish in 2027, oral results in 2027. Cash $960M, burn about $100M per quarter.",ev:"Phase 3 results",dt:"2027-09-30",p:.6,u:80,d:55,pos:"Strong results: filing path opens, partner or buyout interest, funded.",neg:"Weak weight loss versus rivals: sharp drop, but cash still lasts years."},
{s:"KURA",n:"Kura Oncology",px:7.57,pd:"Nov 10",depth:"Marketed drug plus second drug",st:"KOMZIFTI on the market; frontline Phase 3 under way",hd:"Q3 sales $13.9M, up 53% on the quarter. Cash $492.1M. Frontline topline 2028. A rival drug from J&J is emerging.",ev:"Phase 3 topline",dt:"2028-06-30",p:.5,u:150,d:50,pos:"Frontline win: much larger market, milestone cash from partner.",neg:"Miss or slow launch: more share sales, stock near lows."},
{s:"SVRA",n:"Savara",px:null,pd:"",depth:"Single drug",st:"Molgramostim (lung disease) BLA under FDA review",hd:"FDA said it will miss the Nov 22 date, new date not yet known. Cash $173M on Jun 30 plus up to $150M if approved.",ev:"FDA decision",dt:null,p:.65,u:60,d:50,pos:"Approval: extra $150M non-dilutive funding unlocks, launch begins.",neg:"Rejection: only drug, so heavy cuts or a raise at low prices."}]};
const G={odds:0,up:100,dn:100,dil:10,delay:0,amt:5000,max:100};
const C=[["odds","Odds shift (points)","Moves every success chance up or down together.",-30,30,5],["up","Upside scale (%)","Scales how much a success lifts the stock.",50,150,5],["dn","Downside scale (%)","Scales how much a failure drops it.",50,150,5],["dil","Dilution (%)","Share issuance that shrinks both gains and losses.",0,30,1],["delay","Delay (months)","Pushes every event date later.",0,12,1],["amt","Investment ($)","Stake size used for profit estimates.",500,50000,500],["max","Max share price ($)","Hides companies priced above this.",5,100,5]];
const $=id=>document.getElementById(id),M=m=>m.toLocaleString("en-US");
$("ctl").innerHTML=C.map(c=>`<div><label for="${c[0]}">${c[1]}<output id="o${c[0]}"></output></label><input type="range" id="${c[0]}" min="${c[3]}" max="${c[4]}" step="${c[5]}" value="${G[c[0]]}"><span class="mut">${c[2]}</span></div>`).join("");
function calc(c){const p=Math.min(.98,Math.max(.02,c.p+G.odds/100)),k=1-G.dil/100,gain=(1+c.u*G.up/10000)*k-1,loss=(1-c.d*G.dn/10000)*k-1,ev=p*gain+(1-p)*loss;let when="TBD";if(c.dt){const t=new Date(c.dt);t.setMonth(t.getMonth()+G.delay);when=t.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})}return{p,gain,loss,ev,when}}
const pc=x=>(x>=0?"+":"")+Math.round(x*100)+"%";
function draw(){C.forEach(c=>{G[c[0]]=+$(c[0]).value;$("o"+c[0]).textContent=G[c[0]]});
const rows=D.co.filter(c=>c.px===null||c.px<=G.max).map(c=>({c,r:calc(c)})).sort((a,b)=>b.r.ev-a.r.ev);
$("asof").textContent="Data as of "+D.asof;
$("rank").innerHTML="<tr><th>#</th><th>Stock</th><th>Event</th><th>Date</th><th>Win odds</th><th>Expected</th><th>Profit if win</th><th>Loss if fail</th></tr>"+rows.map((x,i)=>`<tr><td>${i+1}</td><td><b>${x.c.s}</b></td><td>${x.c.ev}</td><td>${x.r.when}</td><td>${Math.round(x.r.p*100)}%</td><td class="${x.r.ev>=0?"up":"dn"}">${pc(x.r.ev)} ($${M(Math.round(G.amt*x.r.ev))})</td><td class="up">$${M(Math.round(G.amt*x.r.gain))}</td><td class="dn">-$${M(Math.round(-G.amt*x.r.loss))}</td></tr>`).join("");
$("cards").innerHTML=rows.map(x=>{const c=x.c;return `<details><summary><span><h2 style="display:inline">${c.n}</h2> <span class="mut">${c.s}</span></span><span class="ev ${x.r.ev>=0?"up":"dn"}">${pc(x.r.ev)}</span></summary>
<p><b>Price:</b> ${c.px?"$"+c.px+" ("+c.pd+")":"not verified yet"} &middot; <b>Pipeline depth:</b> ${c.depth}</p><p><b>Where it stands:</b> ${c.st}</p><p><b>Where trials are headed:</b> ${c.hd}</p>
<div class="sc"><b>If it goes well (${x.r.when}, ${pc(x.r.gain)}):</b> ${c.pos}</div><div class="sc n"><b>If it goes badly (${pc(x.r.loss)}):</b> ${c.neg}</div></details>`}).join("")}
document.querySelectorAll("input[type=range]").forEach(i=>i.oninput=draw);draw();
fetch("data.json").then(r=>r.ok?r.json():null).then(j=>{if(j&&j.co){D.asof=j.asof;j.co.forEach(n=>{const o=D.co.find(c=>c.s===n.s);if(o)Object.assign(o,n)});draw()}}).catch(()=>{});
</script></body></html>
