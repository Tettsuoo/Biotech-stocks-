# Save as .github/workflows/weekly.yml. Also put biotech-dashboard.html (renamed index.html)
# and update_data.py in the repo, then enable GitHub Pages. Add ANTHROPIC_API_KEY as a repo secret.
name: weekly-refresh
on:
  schedule: [{cron: "0 12 * * 1"}]   # Mondays 12:00 UTC
  workflow_dispatch: {}
permissions: {contents: write}
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install yfinance requests anthropic
      - run: python update_data.py
        env: {ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}"}
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add data.json && git commit -m "weekly data" || true
          git push
